<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery Foto Aman</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <style>
    /* Tambahan CSS anti screen capture (opsional) */
    body, #gallery, #uploadPopup {
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col">

  <!-- Navbar -->
  <div class="flex justify-between items-center p-4 bg-white shadow-md">
    <h1 class="text-xl font-bold">📷 Gallery Kisaran</h1>
    <button id="menuBtn" class="text-2xl">☰</button>
  </div>

  <!-- Menu Overlay -->
  <div id="menuOverlay" class="fixed inset-0 bg-black bg-opacity-50 hidden"></div>
  <div id="menuBox" class="fixed top-0 right-0 w-48 bg-white shadow-lg rounded-l-2xl hidden">
    <ul class="flex flex-col p-4 space-y-3">
      <li>
        <button id="uploadPageBtn" class="w-full text-left px-2 py-1 hover:bg-gray-100 rounded">
          Upload
        </button>
      </li>
    </ul>
  </div>

  <!-- Gallery Foto -->
  <div class="p-4 grid grid-cols-2 md:grid-cols-4 gap-4" id="gallery"></div>

  <!-- Popup Upload & Manage -->
  <div id="uploadPopup" class="fixed inset-0 bg-black bg-opacity-60 flex justify-center items-center hidden">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-[90%] md:w-[500px] relative">
      <button id="closePopup" class="absolute top-2 right-3 text-xl">✖</button>
      <h2 class="text-lg font-bold mb-3">Upload & Kelola Foto 📤</h2>
      
      <!-- Upload Form -->
      <div class="mb-4">
        <input type="file" id="fileInput" class="mb-3 w-full" accept="image/*">
        <button id="uploadBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg w-full">
          Upload
        </button>
        <p id="status" class="text-center text-gray-600 mt-3"></p>
      </div>

      <!-- Manage Foto -->
      <h3 class="text-md font-semibold mb-2">Kelola Foto:</h3>
      <div id="manageGallery" class="grid grid-cols-2 gap-3 max-h-60 overflow-y-auto"></div>
    </div>
  </div>

  <script>
    // 🔥 Config Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyClH3h1diSbClyvr1-WTeJ26FOV7-a31QY",
      authDomain: "biasaye.firebaseapp.com",
      projectId: "biasaye",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const gallery = document.getElementById("gallery");
    const manageGallery = document.getElementById("manageGallery");

    // Realtime load untuk gallery umum
    db.collection("photos").orderBy("createdAt", "desc").onSnapshot(snapshot => {
      gallery.innerHTML = "";
      snapshot.forEach(doc => {
        const data = doc.data();
        const img = document.createElement("img");
        img.src = data.image;
        img.className = "w-full h-40 object-cover rounded-xl shadow-md";
        gallery.appendChild(img);
      });
    });

    // Menu logic
    const menuBtn = document.getElementById("menuBtn");
    const menuBox = document.getElementById("menuBox");
    const menuOverlay = document.getElementById("menuOverlay");
    const uploadPageBtn = document.getElementById("uploadPageBtn");
    const uploadPopup = document.getElementById("uploadPopup");
    const closePopup = document.getElementById("closePopup");

    menuBtn.addEventListener("click", () => {
      menuBox.classList.toggle("hidden");
      menuOverlay.classList.toggle("hidden");
    });
    menuOverlay.addEventListener("click", () => {
      menuBox.classList.add("hidden");
      menuOverlay.classList.add("hidden");
    });

    // PIN check untuk buka upload popup
    uploadPageBtn.addEventListener("click", () => {
      const pin = prompt("Masukkan PIN:");
      if (pin === "88") { // PIN upload
        uploadPopup.classList.remove("hidden");
        loadManageGallery();
      } else {
        alert("PIN salah!");
      }
    });

    closePopup.addEventListener("click", () => {
      uploadPopup.classList.add("hidden");
    });

    // Fungsi load foto untuk halaman manage
    function loadManageGallery() {
      db.collection("photos").orderBy("createdAt", "desc").get().then(snapshot => {
        manageGallery.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const div = document.createElement("div");
          div.className = "relative";

          const img = document.createElement("img");
          img.src = data.image;
          img.className = "w-full h-28 object-cover rounded-md shadow";

          const delBtn = document.createElement("button");
          delBtn.textContent = "🗑";
          delBtn.className = "absolute top-1 right-1 bg-red-500 text-white px-2 py-1 text-xs rounded";
          delBtn.onclick = async () => {
            if (confirm("Yakin hapus foto ini?")) {
              await db.collection("photos").doc(doc.id).delete();
              loadManageGallery();
            }
          };

          div.appendChild(img);
          div.appendChild(delBtn);
          manageGallery.appendChild(div);
        });
      });
    }

    // Compress gambar
    function compressImage(file, maxWidth = 600, maxHeight = 600, quality = 0.6) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;

          img.onload = () => {
            const canvas = document.createElement("canvas");
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height *= maxWidth / width;
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width *= maxHeight / height;
                height = maxHeight;
              }
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);

            resolve(canvas.toDataURL("image/jpeg", quality));
          };
        };

        reader.onerror = (error) => reject(error);
      });
    }

    // Upload foto
    const fileInput = document.getElementById("fileInput");
    const uploadBtn = document.getElementById("uploadBtn");
    const status = document.getElementById("status");

    uploadBtn.addEventListener("click", async () => {
      const file = fileInput.files[0];
      if (!file) {
        alert("Pilih foto dulu!");
        return;
      }

      status.textContent = "Mengupload...";

      try {
        const compressedBase64 = await compressImage(file, 600, 600, 0.6);
        await db.collection("photos").add({
          image: compressedBase64,
          createdAt: new Date()
        });

        status.textContent = "✅ Upload berhasil!";
        fileInput.value = "";
        loadManageGallery(); // refresh manage
      } catch (error) {
        console.error(error);
        status.textContent = "❌ Upload gagal!";
      }
    });

    // 🚫 Anti Screenshot / Save itu pun kalo manjur awoakwoakwk
    document.addEventListener("keydown", function(e) {
      if (e.key === "PrintScreen") {
        alert("Screenshot dinonaktifkan!");
        navigator.clipboard.writeText(""); // kosongkan clipboard
      }
      if (e.ctrlKey && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        alert("Save halaman dinonaktifkan!");
      }
      if (e.ctrlKey && e.shiftKey && e.key === "I") {
        e.preventDefault();
        alert("Inspect Element dinonaktifkan!");
      }
    });

    // Blok klik kanan
    document.addEventListener("contextmenu", e => e.preventDefault());
  </script>
</body>
    </html>
